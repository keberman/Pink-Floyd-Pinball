#config_version=6
 
##############################################################################
# MODE_START
# Shared VUK qualification window for all main modes
# Activated when any mode qualification is complete
# 60 second window to hit VUK → mode launches
# Timeout → pending mode progress resets, physical hardware restored
#
# ⚠️ LESSON 12: qualify_complete events cannot appear in BOTH start_events
# AND variable_player in the same file. pending_mode is set from each
# qualifying mode's own yaml instead.
##############################################################################
 
mode:
  priority: 175
  game_mode: true
  start_events: wall_qualify_complete, dsotm_qualify_complete, animals_qualify_complete, wywh_qualify_complete, divisionbell_qualify_complete
  stop_events: mode_start_success, timer_vuk_window_timer_complete, ball_ended
  events_when_started: mode_start_activated
  events_when_stopped: mode_start_stopped
 
slide_player:
  mode_start_activated: mode_start
 
sound_player:
  mode_start_activated:
    heart_beat_trimmed:
      bus: mode_music
 
##############################################################################
# 60 SECOND VUK WINDOW TIMER
##############################################################################
 
timers:
  vuk_window_timer:
    start_value: 60
    end_value: 0
    direction: down
    control_events:
      - event: mode_start_activated
        action: start
      - event: mode_start_stopped
        action: stop
      - event: mode_start_stopped
        action: reset
 
##############################################################################
# VARIABLE PLAYER
# pending_mode is NOT set here — set in each qualifying mode's own yaml.
# See Lesson 12.
##############################################################################
 
variable_player:
  mode_start_stopped:
    pending_mode:
      action: set
      string: inactive
 
  reset_wall_progress:
    wall_progress:
      action: set
      int: 0
 
  reset_dsotm_progress:
    dsotm_progress:
      action: set
      int: 0
 
  reset_animals_progress:
    animals_progress:
      action: set
      int: 0
 
  reset_wywh_progress:
    wywh_progress:
      action: set
      int: 0
 
  reset_divisionbell_progress:
    divisionbell_progress:
      action: set
      int: 0
 
  timer_vuk_window_timer_tick:
    vuk_seconds_remaining:
      action: set
      int: ticks_remaining
 
##############################################################################
# COIL PLAYER
##############################################################################
 
coil_player:
  s_vuk_opto_active:
    c_vuk:
      action: pulse
      pulse_ms: 35
 
##############################################################################
# EVENT PLAYER
##############################################################################
 
event_player:
  "s_vuk_opto_active{current_player.pending_mode == 'wall'}":
    - mode_start_success
    - start_the_wall
 
  "s_vuk_opto_active{current_player.pending_mode == 'dsotm'}":
    - mode_start_success
    - start_dsotm
 
  "s_vuk_opto_active{current_player.pending_mode == 'animals'}":
    - mode_start_success
    - start_animals
 
  "s_vuk_opto_active{current_player.pending_mode == 'wywh'}":
    - mode_start_success
    - start_wywh
 
  "s_vuk_opto_active{current_player.pending_mode == 'divisionbell'}":
    - mode_start_success
    - start_divisionbell
 
  "timer_vuk_window_timer_complete{current_player.pending_mode == 'wall'}":
    - wall_clear
    - fire_upper_reset
    - fire_lower_reset|200ms
    - fire_hammer_reset|400ms
 
  "timer_vuk_window_timer_complete{current_player.pending_mode == 'dsotm'}":
    - reset_dsotm_progress
 
  "timer_vuk_window_timer_complete{current_player.pending_mode == 'animals'}":
    - reset_animals_progress
 
  "timer_vuk_window_timer_complete{current_player.pending_mode == 'wywh'}":
    - reset_wywh_progress
 
  "timer_vuk_window_timer_complete{current_player.pending_mode == 'divisionbell'}":
    - reset_divisionbell_progress